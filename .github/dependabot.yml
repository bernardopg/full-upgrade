# Dependabot — mantém as GitHub Actions pinadas por SHA e o lockfile do
# Semgrep (.github/requirements-semgrep.txt, hash-pinned) atualizados.
# Projeto é Bash puro: sem package.json/go.mod/Cargo.toml/Dockerfile commitados,
# então só esses dois ecossistemas se aplicam. (Se algum dia surgir outro
# manifesto, adicione uma nova entrada em "updates".)
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Sao_Paulo
    cooldown:
      default-days: 7   # espera releases novos "assentarem" antes de propor bump
    open-pull-requests-limit: 5
    commit-message:
      prefix: ci
      include: scope
    labels:
      - dependencies
      - github-actions
      - ci                 # PRs do Dependabot sempre tocam .github/workflows
    groups:
      actions-minor:
        update-types:
          - minor
          - patch
        # majors continuam em PRs individuais (default) — maior risco de breaking.

  - package-ecosystem: pip
    directory: "/.github"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Sao_Paulo
    cooldown:
      default-days: 7   # espera releases novos "assentarem" antes de propor bump
    open-pull-requests-limit: 5
    commit-message:
      prefix: ci
      include: scope
    labels:
      - dependencies
      - ci
    ignore:
      # mcp 2.x renomeou FastMCP para MCPServer e o Semgrep (que fixa
      # mcp==1.29.0) ainda importa mcp.server.fastmcp: o bump para 2.3.0
      # quebra o import do servidor MCP no job. Libere quando o Semgrep
      # declarar suporte a mcp>=2.
      - dependency-name: mcp
        update-types:
          - version-update:semver-major
