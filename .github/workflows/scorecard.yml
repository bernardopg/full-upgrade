name: Scorecard

# OpenSSF Scorecard: postura de segurança/cadeia de suprimentos do repo.
# Público + gratuito. Publica o score que alimenta o badge no README.

on:
  push:
    branches: [main]
  schedule:
    - cron: "33 5 * * 1"   # segunda 05:33 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write   # upload SARIF p/ code scanning
      id-token: write           # OIDC p/ assinar/publicar o score público
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Scorecard recomenda persist-credentials: false p/ evitar leak.
          persist-credentials: false

      - name: Run Scorecard
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true   # habilita o badge público (scorecard.dev)
          repo_token: ${{ secrets.SCORECARD_READ_TOKEN }}

      - name: Upload SARIF to GitHub code scanning
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: results.sarif
          category: ossf-scorecard

      - name: Upload SARIF artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-results
          path: results.sarif
          if-no-files-found: error
          retention-days: 14
