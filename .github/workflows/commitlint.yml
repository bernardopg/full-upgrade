name: Commit Lint

# Garante Conventional Commits tanto no fluxo principal (push direto na main)
# quanto nos PRs opcionais. Melhora o changelog gerado automaticamente pelo
# generate_release_notes nas releases.

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

# Um push novo na mesma ref torna o lint anterior obsoleto. A chave funciona
# para push e PR (github.ref é refs/heads/main ou refs/pull/N/merge).
concurrency:
  group: commitlint-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-commits:
    name: Validar Conventional Commits
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # histórico completo p/ ler os commits do PR

      - uses: wagoid/commitlint-github-action@b948419dd99f3fd78a6548d48f94e3df7f6bf3ed # v6.2.1
        with:
          configFile: .commitlintrc.json
