name: Semgrep

# SAST para Bash — preenche a lacuna do CodeQL, que NÃO suporta Bash.
# Achados aparecem em Security > Code scanning alerts e bloqueiam o workflow.
# Path-filtered: só roda quando código Bash (ou o próprio setup do Semgrep)
# muda; a varredura semanal cobre regressões de regras novas.

on:
  push:
    branches: [main]
    paths:
      - "**.sh"
      - "**.bash"
      - ".github/workflows/semgrep.yml"
      - ".github/requirements-semgrep.in"
      - ".github/requirements-semgrep.txt"
  pull_request:
    paths:
      - "**.sh"
      - "**.bash"
      - ".github/workflows/semgrep.yml"
      - ".github/requirements-semgrep.in"
      - ".github/requirements-semgrep.txt"
  schedule:
    - cron: "17 3 * * 1"   # segunda 03:17 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: semgrep-${{ github.ref }}
  cancel-in-progress: true

jobs:
  semgrep:
    name: Semgrep SAST (Bash)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write   # upload SARIF p/ code scanning
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Bloqueante: regra encontrada é regressão de segurança. Rodamos a CLI
      # direto (não a action Docker) para gerar o SARIF e falhar com --error.
      # A instalação usa --require-hashes; bump exige regenerar o lock inteiro.
      - name: Semgrep scan
        id: semgrep
        run: |
          python3 -m pip install --user --require-hashes -r .github/requirements-semgrep.txt
          semgrep scan --config p/default --error --sarif --output semgrep.sarif

      # Bloqueante: o lock hash-pinned não pode introduzir CVE conhecida.
      # O próprio pip-audit vem do mesmo lock, sem instalação ad-hoc não fixada.
      - name: Audit locked Python dependencies
        run: |
          # Semgrep 1.173.0 fixa mcp==1.29.0 e click==8.4.2, que já corrigem as
          # CVEs de servidor MCP (CVE-2026-52869/52870/59950) e de click.edit()
          # (PYSEC-2026-2132) antes ignoradas aqui. Qualquer vulnerabilidade
          # conhecida no lock bloqueia o workflow, com uma exceção: o PyJWT. O
          # semgrep 1.178.0 (última versão) fixa pyjwt~=2.13.0, e o GitHub
          # segue publicando advisories do 2.13 corrigidos só no 2.14.0 (nove
          # em 29/09/2026). Listar CVE por CVE quebrava o workflow a cada nova.
          # O PyJWT só serve ao login do semgrep; este scan é offline e não
          # valida JWT nem carrega JWKS. Remover a exceção quando o semgrep
          # liberar pyjwt>=2.14.
          python3 -m pip_audit --strict --require-hashes --disable-pip \
            -f json -o pip-audit.json -r .github/requirements-semgrep.txt || true
          jq -e '.dependencies' pip-audit.json >/dev/null
          jq -r '.dependencies[] | select(.name == "pyjwt") | .vulns[] | "  ignorado (pyjwt fixado pelo semgrep): \(.id)"' pip-audit.json
          vulns="$(jq -r '.dependencies[] | select(.name != "pyjwt") | .name as $n | .vulns[] | "\($n) \(.id) fix=\(.fix_versions | join(","))"' pip-audit.json)"
          if [[ -n "$vulns" ]]; then
            printf 'Vulnerabilidades no lock:\n%s\n' "$vulns"
            exit 1
          fi

      - name: Upload SARIF to GitHub code scanning
        if: always() && hashFiles('semgrep.sarif') != ''
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: semgrep.sarif
          category: semgrep
