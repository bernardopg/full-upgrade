name: Commit Lint

# Garante Conventional Commits nos PRs — melhora o changelog gerado
# automaticamente pelo generate_release_notes nas releases.

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

# Required check: cancelar runs antigos do mesmo PR evita que um verde obsoleto
# fique valendo depois de um force-push que trocou as mensagens de commit.
concurrency:
  group: commitlint-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  lint-commits:
    name: Validar Conventional Commits
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # histórico completo p/ ler os commits do PR

      - uses: wagoid/commitlint-github-action@b948419dd99f3fd78a6548d48f94e3df7f6bf3ed # v6.2.1
        with:
          configFile: .commitlintrc.json
