name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag a publicar (ex: v3.0.0)"
        required: true

permissions:
  contents: read

# Uma release por vez, e NUNCA cancelada no meio: o job publica tag, GitHub
# Release e AUR: interromper entre essas etapas deixaria estado meio-publicado.
concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
  cancel-in-progress: false

# Caminho workflow_dispatch: o bump de VERSION + fechamento do CHANGELOG são
# empurrados DIRETO no `main`. Antes iam por um PR de ciclo curto que existia só
# para satisfazer os required status checks da branch protegida — com toda a
# frágil dança de PAT/anti-loop que travou o release 3.22.0. A main não exige
# mais PR, então o PR do bump virou pura cerimônia e foi removido.
#
# O portão não se perdeu: o job `release` logo abaixo revalida tudo (bash -n +
# shellcheck + bats) no commit já mesclado, ANTES de buildar, atestar e criar a
# tag. Um bump quebrado falha ali e nenhuma release é publicada.
#
# O push continua usando o FU_RELEASE_TOKEN (PAT), não o GITHUB_TOKEN: pushes
# feitos com o GITHUB_TOKEN não disparam workflows (anti-loop), e queremos o CI
# rodando no commit de bump que acabou de entrar na main.
# O caminho de tag-push (manual) não toca no `main`.

jobs:
  bump:
    name: Bump VERSION (workflow_dispatch)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # push do commit de bump direto na main
    outputs:
      version: ${{ steps.ver.outputs.version }}
      tag: ${{ steps.ver.outputs.tag }}
      sha: ${{ steps.sha.outputs.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # O checkout grava estas credenciais no .git/config e o `git push` do
          # bump as reusa. Tem que ser o PAT: push feito com o GITHUB_TOKEN não
          # dispara workflows (anti-loop), e o commit de bump entraria na main
          # sem CI nenhum.
          token: ${{ secrets.FU_RELEASE_TOKEN }}

      - name: Resolver versão
        id: ver
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          v="${INPUT_TAG}"
          echo "tag=${v}" >> "$GITHUB_OUTPUT"
          echo "version=${v#v}" >> "$GITHUB_OUTPUT"

      - name: Bump de VERSION + fechar CHANGELOG e empurrar na main
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          TAG: ${{ steps.ver.outputs.tag }}
          # Sem GH_TOKEN: este passo não chama mais o `gh`. O push usa as
          # credenciais que o checkout gravou no .git/config (o PAT).
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout main

          printf '%s\n' "${VERSION}" > VERSION
          # Atualiza só a linha de fallback literal (valor começa com dígito);
          # as linhas que resolvem via git describe / arquivo VERSION usam
          # variáveis ($_git_ver/$_file_ver) e não devem ser sobrescritas.
          sed -i -E "s/SCRIPT_VERSION=\"[0-9][^\"]*\"/SCRIPT_VERSION=\"${VERSION}\"/" full-upgrade.sh
          sed -i -E "s/_build_ver=\"[0-9][^\"]*\"/_build_ver=\"${VERSION}\"/" build.sh
          bash -n full-upgrade.sh build.sh

          # Fecha a seção [Unreleased] do CHANGELOG sob a nova versão (idempotente:
          # não faz nada se a seção está vazia ou o heading da versão já existe).
          python3 - "$VERSION" <<'PYEOF'
          import re, sys, datetime
          version = sys.argv[1]
          path = 'CHANGELOG.md'
          text = open(path).read()
          if f'## [{version}]' in text:
              print(f'CHANGELOG já tem {version}; nada a fazer.')
              sys.exit(0)
          m = re.search(r'^## \[Unreleased\]\s*\n(.*?)(?=^## \[|\Z)', text, re.M | re.S)
          if not m or not m.group(1).strip():
              # Não é erro fatal (releases só de bump existem), mas é quase sempre
              # sinal de que as entradas foram gravadas na seção da versão anterior
              # em vez de [Unreleased] — foi o que deixou a 3.33.1 sem seção própria.
              print(f'::warning::Seção [Unreleased] vazia; a release {version} não terá'
                    ' seção no CHANGELOG. Confira se as entradas não foram parar na'
                    ' seção da versão anterior.')
              sys.exit(0)
          today = datetime.date.today().isoformat()
          heading = f'## [Unreleased]\n\n## [{version}] - {today}\n'
          text = text[:m.start()] + heading + m.group(1).lstrip('\n') + text[m.end():]
          open(path, 'w').write(text)
          print(f'CHANGELOG: [Unreleased] fechado como [{version}] - {today}.')
          PYEOF

          git add VERSION full-upgrade.sh build.sh CHANGELOG.md
          git commit -m "chore(release): bump VERSION para ${VERSION}"

          # Push direto na main. `--force-with-lease` NÃO entra aqui: o ruleset
          # proíbe non-fast-forward e um push que não avance a main deve falhar
          # ruidosamente (sinal de corrida com outro push) em vez de sobrescrever.
          git push origin main

      - name: Capturar SHA do commit de bump
        id: sha
        run: |
          sha="$(git rev-parse HEAD)"
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"
          echo "Bump em main: ${sha}"

  release:
    name: Build & Publish
    needs: bump
    # Roda após o bump (dispatch) ou diretamente em push de tag (bump é skipped).
    if: always() && (needs.bump.result == 'success' || github.event_name == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write       # criar release + push da tag
      id-token: write       # para gerar atestações de build
      attestations: write   # para persistir atestações de build
    outputs:
      tag: ${{ steps.tag.outputs.name }}
      version: ${{ steps.tag.outputs.version }}
    steps:
      - name: Checkout
        # dispatch: checkout exato do commit mesclado pelo bump; push: a tag.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ (github.event_name == 'workflow_dispatch' && needs.bump.outputs.sha) || github.ref }}

      # Mesma toolchain do CI (ci.yml): shellcheck e bats vindos dos instaladores
      # pinados. Usar o `bats`/`shellcheck` do apt rodava o portão de release numa
      # versão diferente da que aprovou o commit — mais frouxo (ou mais estrito)
      # que o portão do CI, que é exatamente o que não se quer numa release.
      - name: Install shellcheck + bats
        run: |
          scripts/install-shellcheck.sh
          echo "$PWD/.ci/shellcheck/bin" >> "$GITHUB_PATH"
          scripts/install-bats.sh
          echo "$PWD/.ci/bats/bin" >> "$GITHUB_PATH"

      - name: Validate before release
        run: |
          shopt -s nullglob
          for f in full-upgrade.sh lib/*.sh lib/steps/*.sh steps.d/*.sh install.sh build.sh scripts/*.sh; do
            bash -n "$f"
          done
          shellcheck --version
          shellcheck -S warning -x \
            full-upgrade.sh lib/*.sh lib/steps/*.sh steps.d/*.sh install.sh build.sh scripts/*.sh
          bats --jobs "$(nproc)" tests/

      - name: Build standalone
        env:
          # No dispatch, a tag só é criada depois do build. Passe a versão
          # resolvida explicitamente para não embutir o git-describe anterior.
          FULL_UPGRADE_BUILD_VERSION: ${{ (github.event_name == 'workflow_dispatch' && needs.bump.outputs.version) || github.ref_name }}
        run: |
          ./build.sh
          test "$(dist/full-upgrade-standalone.sh --version)" = "${FULL_UPGRADE_BUILD_VERSION#v}"
          # Mesma verificação do CI: o artefato publicado é o que o usuário
          # baixa, então ele precisa ao menos parsear, listar o catálogo e
          # sobreviver a um run completo em --dry-run sem config nenhuma.
          bash -n dist/full-upgrade-standalone.sh
          dist/full-upgrade-standalone.sh --list-steps >/dev/null
          XDG_CONFIG_HOME="$RUNNER_TEMP/nocfg" \
            dist/full-upgrade-standalone.sh --dry-run --mode full >/dev/null
          (cd dist && sha256sum full-upgrade-standalone.sh > full-upgrade-standalone.sh.sha256)
          (cd dist && sha256sum -c full-upgrade-standalone.sh.sha256)
          cat dist/full-upgrade-standalone.sh.sha256

      - name: Attest build provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: |
            dist/full-upgrade-standalone.sh
            dist/full-upgrade-standalone.sh.sha256

      - name: Resolve tag
        id: tag
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
            name="${INPUT_TAG}"
          else
            name="${GITHUB_REF_NAME}"
          fi
          echo "name=${name}" >> "$GITHUB_OUTPUT"
          echo "version=${name#v}" >> "$GITHUB_OUTPUT"

      # O gerador automático do GitHub privilegia PRs e omite commits enviados
      # direto à main — justamente o fluxo principal deste repo. Usa a seção
      # versionada do CHANGELOG como fonte autoritativa e acrescenta o compare.
      - name: Preparar notas completas da release
        env:
          TAG: ${{ steps.tag.outputs.name }}
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          scripts/extract-release-notes.sh "${VERSION}" > dist/release-notes.md
          previous="$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)"
          if [ -n "${previous}" ]; then
            printf '\n\n**Full Changelog**: https://github.com/%s/compare/%s...%s\n' \
              "${GITHUB_REPOSITORY}" "${previous}" "${TAG}" >> dist/release-notes.md
          fi
          test -s dist/release-notes.md

      # No workflow_dispatch a tag ainda não existe (foi criada só no main);
      # cria e empurra. No push de tag a tag já existe (criada por quem disparou).
      - name: Criar e empurrar tag (apenas workflow_dispatch)
        if: github.event_name == 'workflow_dispatch'
        env:
          TAG: ${{ steps.tag.outputs.name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "${TAG}"
          git push origin "${TAG}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: full-upgrade ${{ steps.tag.outputs.name }}
          body_path: dist/release-notes.md
          files: |
            dist/full-upgrade-standalone.sh
            dist/full-upgrade-standalone.sh.sha256

  publish-aur:
    name: Publish to AUR
    needs: release
    runs-on: ubuntu-latest
    # Margem para a espera de até 10min por janelas de manutenção do AUR.
    timeout-minutes: 25
    # Publica tanto em push de tag v* quanto em workflow_dispatch manual, desde
    # que a tag informada exista no repositório. Requer os secrets AUR_* configurados.
    if: always() && needs.release.result == 'success' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && startsWith(inputs.tag, 'v')))
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validar existência da tag informada
        env:
          TAG: ${{ needs.release.outputs.tag }}
        run: |
          set -euo pipefail
          test -n "${TAG}"
          git fetch --depth=1 origin "refs/tags/${TAG}:refs/tags/${TAG}" || {
            echo "Tag ${TAG} não encontrada no repositório remoto; abortando publicação no AUR."
            exit 1
          }
          echo "Tag ${TAG} validada no repositório."

      - name: Preparar PKGBUILD com a versão da release
        id: pkg
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          set -euo pipefail
          test -n "${VERSION}"
          workdir="$RUNNER_TEMP/aurpkg"
          mkdir -p "$workdir"
          cp packaging/aur/PKGBUILD "$workdir/PKGBUILD"
          # Fixa pkgver na versão publicada e reseta pkgrel=1.
          sed -i -E "s/^pkgver=.*/pkgver=${VERSION}/" "$workdir/PKGBUILD"
          sed -i -E "s/^pkgrel=.*/pkgrel=1/" "$workdir/PKGBUILD"
          echo "workdir=${workdir}" >> "$GITHUB_OUTPUT"

      - name: Calcular checksum real do tarball da tag
        env:
          VERSION: ${{ needs.release.outputs.version }}
          WORKDIR: ${{ steps.pkg.outputs.workdir }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          workdir="${WORKDIR}"
          url="https://github.com/${REPO}/archive/refs/tags/v${VERSION}.tar.gz"
          # Aguarda o tarball da tag ficar disponível e baixa.
          for i in 1 2 3 4 5; do
            if curl -fsSL -o "$workdir/src.tar.gz" "$url"; then break; fi
            echo "tarball ainda indisponível (tentativa $i); aguardando..."; sleep 10
          done
          sum="$(sha256sum "$workdir/src.tar.gz" | awk '{print $1}')"
          echo "sha256=${sum}"
          # Substitui o placeholder SKIP pelo checksum real.
          sed -i -E "s/^sha256sums=.*/sha256sums=('${sum}')/" "$workdir/PKGBUILD"
          echo "--- PKGBUILD final ---"; cat "$workdir/PKGBUILD"

      # O AUR entra em janelas de manutenção curtas que derrubam o push SSH com
      # "The AUR is down due to maintenance". Sem esta espera, a release fica
      # publicada no GitHub mas nunca chega ao AUR (ver runs 30730454179 e
      # 31337731906). Aguardamos o serviço voltar antes de tentar publicar.
      - name: Aguardar AUR ficar disponível
        run: |
          set -euo pipefail
          for i in $(seq 1 20); do
            if git ls-remote https://aur.archlinux.org/full-upgrade.git >/dev/null 2>&1; then
              echo "AUR disponível na tentativa ${i}."
              exit 0
            fi
            echo "AUR indisponível (tentativa ${i}/20); aguardando 30s..."
            sleep 30
          done
          echo "AUR permaneceu indisponível após 10 minutos; abortando publicação."
          exit 1

      - name: Validar PKGBUILD e gerar .SRCINFO
        uses: KSXGitHub/github-actions-deploy-aur@084b0d9b15415bf9cdb65d44dad1efe37a354050 # v4.2.0
        with:
          pkgname: full-upgrade
          pkgbuild: ${{ steps.pkg.outputs.workdir }}/PKGBUILD
          commit_username: ${{ secrets.AUR_USERNAME }}
          commit_email: ${{ secrets.AUR_EMAIL }}
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: "Atualiza para v${{ needs.release.outputs.version }}"
          ssh_keyscan_types: rsa,ecdsa,ed25519
          updpkgsums: false
