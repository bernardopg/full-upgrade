name: Semgrep

# SAST para Bash — preenche a lacuna do CodeQL, que NÃO suporta Bash.
# Achados aparecem em Security > Code scanning alerts e bloqueiam o workflow.
# Path-filtered: só roda quando código Bash (ou o próprio setup do Semgrep)
# muda; a varredura semanal cobre regressões de regras novas.

on:
  push:
    branches: [main]
    paths:
      - "**.sh"
      - "**.bash"
      - ".github/workflows/semgrep.yml"
      - ".github/requirements-semgrep.in"
      - ".github/requirements-semgrep.txt"
      - ".github/requirements-semgrep-overrides.txt"
  pull_request:
    paths:
      - "**.sh"
      - "**.bash"
      - ".github/workflows/semgrep.yml"
      - ".github/requirements-semgrep.in"
      - ".github/requirements-semgrep.txt"
      - ".github/requirements-semgrep-overrides.txt"
  schedule:
    - cron: "17 3 * * 1"   # segunda 03:17 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: semgrep-${{ github.ref }}
  cancel-in-progress: true

jobs:
  semgrep:
    name: Semgrep SAST (Bash)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write   # upload SARIF p/ code scanning
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Bloqueante: regra encontrada é regressão de segurança. Rodamos a CLI
      # direto (não a action Docker) para gerar o SARIF e falhar com --error.
      # A instalação usa --require-hashes; bump exige regenerar o lock inteiro.
      - name: Semgrep scan
        id: semgrep
        run: |
          # O lock completo incorpora o override documentado do pin MCP upstream.
          # --no-deps impede re-resolver mcp==1.29.0 vulnerável; hashes e auditoria
          # continuam obrigatórios para todos os pacotes efetivamente instalados.
          python3 -m pip install --user --no-deps --require-hashes -r .github/requirements-semgrep.txt
          python3 - <<'PY'
          from importlib.metadata import version
          import semgrep.mcp.server
          from mcp.server.fastmcp import FastMCP
          assert version('mcp') == '1.30.0'
          FastMCP('semgrep-sdk-compatibility-check')
          print('Semgrep MCP compatibility OK:', version('semgrep'), version('mcp'))
          PY
          semgrep scan --config p/default --error --sarif --output semgrep.sarif

      # Bloqueante: o lock hash-pinned não pode introduzir CVE conhecida.
      # O próprio pip-audit vem do mesmo lock, sem instalação ad-hoc não fixada.
      - name: Audit locked Python dependencies
        run: |
          # MCP 1.30.0 corrige CVE-2026-59951. O override é do pin upstream
          # do Semgrep, NÃO uma exceção de segurança: qualquer CVE no lock
          # continua bloqueando. Compatibilidade do SDK é testada acima.
          python3 -m pip_audit --strict --require-hashes --disable-pip \
            -f json -o pip-audit.json -r .github/requirements-semgrep.txt || audit_rc=$?
          jq -e '.dependencies' pip-audit.json >/dev/null
          vulns="$(jq -r '.dependencies[] | .name as $n | .vulns[] | "\($n) \(.id) fix=\(.fix_versions | join(","))"' pip-audit.json)"
          if [[ -n "$vulns" ]]; then
            printf 'Vulnerabilidades no lock:\n%s\n' "$vulns"
            exit 1
          fi
          if [[ -n "${audit_rc:-}" ]]; then
            printf 'pip-audit terminou com erro (rc=%s)\n' "$audit_rc"
            exit 1
          fi

      - name: Upload SARIF to GitHub code scanning
        if: always() && hashFiles('semgrep.sarif') != ''
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: semgrep.sarif
          category: semgrep
